[project]
name = "toklib-ingest"
version = "0.1.0"
description = "TokLib ingest: резолв метаданных, DownloadProvider (yt-dlp/cobalt/embed), воркеры"
requires-python = ">=3.12"
dependencies = [
    "toklib-core",
    "yt-dlp>=2024.12.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toklib_ingest"]
