[project]
name = "toklib-ai"
version = "0.1.0"
description = "TokLib AI: Tier-0 теги, Transcriber/TextAnalyzer/Embedder, маршрутизатор, провайдеры"
requires-python = ">=3.12"
dependencies = [
    "toklib-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1"]
embed = ["sentence-transformers>=3.0", "numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toklib_ai"]
