[project]
name = "toklib-core"
version = "0.1.0"
description = "TokLib core: конфиг, схемы, БД, очередь задач, нормализация ссылок, oEmbed, поиск"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toklib_core"]
