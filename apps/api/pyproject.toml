[project]
name = "toklib-api"
version = "0.1.0"
description = "TokLib API: FastAPI + SSE + воркеры + CLI + Telegram-бот"
requires-python = ">=3.12"
dependencies = [
    "toklib-core",
    "toklib-ingest",
    "toklib-ai",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
bot = ["aiogram>=3.15"]

[project.scripts]
toklib = "toklib_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toklib_api"]
